name: __APP_NAME__

attributes:
  ORGANIZATIONNAME: "__ORG_NAME__"

options:
  bundleIdPrefix: __BUNDLE_ID__
  deploymentTarget:
    iOS: "__DEPLOYMENT_TARGET__"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: __SWIFT_VERSION__
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

packages:
  Modules:
    path: Modules

targets:
  __APP_NAME__:
    type: application
    platform: iOS
    deploymentTarget: "__DEPLOYMENT_TARGET__"
    supportedDestinations:
      - iOS
      - iPadOS
      # - macOS
      # - visionOS
      # - macCatalyst
    sources:
      - path: App/Sources
    resources:
      - path: App/Resources
    dependencies:
      - package: Modules
        product: AppCore
      - package: Modules
        product: CommonUI
      - package: Modules
        product: CoreNavigation
      - package: Modules
        product: CoreNetwork
      - package: Modules
        product: CorePersistence
      - package: Modules
        product: CoreKeychain
      - package: Modules
        product: HomeFeature
      - package: Modules
        product: HomeFeatureData
      - package: Modules
        product: HomeFeatureDomain
      - package: Modules
        product: ProfileFeature
      - package: Modules
        product: ProfileFeatureData
      - package: Modules
        product: ProfileFeatureDomain
    info:
      path: App/Resources/Plist/Info.plist
      properties:
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        PRODUCT_BUNDLE_IDENTIFIER: __BUNDLE_ID__
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: "__APP_NAME__"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets:
        - name: __APP_NAME__Tests
        - name: __APP_NAME__UITests
      gatherCoverageData: true

  __APP_NAME__Tests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "__DEPLOYMENT_TARGET__"
    sources:
      - path: __APP_NAME__Tests
    dependencies:
      - target: __APP_NAME__
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: __BUNDLE_ID__.tests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

  __APP_NAME__UITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "__DEPLOYMENT_TARGET__"
    sources:
      - path: __APP_NAME__UITests
    dependencies:
      - target: __APP_NAME__
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: __BUNDLE_ID__.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
