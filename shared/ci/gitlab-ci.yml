# GitLab CI for __APP_NAME__
# Requires a self-hosted macOS GitLab Runner with Xcode installed. See:
# https://docs.gitlab.com/runner/install/osx.html

stages:
  - lint
  - test

variables:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

.macos:
  tags:
    - macos
  before_script:
    - sudo xcode-select -s /Applications/Xcode.app
    - command -v mise || curl https://mise.run | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - mise install

lint:
  extends: .macos
  stage: lint
  script:
    - swiftlint lint --strict --config .swiftlint.yml
  only:
    - merge_requests
    - main
    - develop

test:
  extends: .macos
  stage: test
  needs: [lint]
  script:
    - __GENERATE_COMMAND__
    - >-
      xcodebuild test
      -workspace __APP_NAME__.xcworkspace
      -scheme __APP_NAME__
      -destination 'platform=iOS Simulator,name=iPhone 16 Pro'
      -skip-testing:__APP_NAME__UITests
      -resultBundlePath TestResults
      -quiet
      | xcbeautify
  artifacts:
    when: on_failure
    paths:
      - TestResults
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - develop
